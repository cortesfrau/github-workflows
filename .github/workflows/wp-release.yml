name: Reusable WordPress Package Release Workflow

on:
  workflow_call:
    inputs:
      # Deprecated in v2: Composer and npm are detected from composer.json and package.json.
      # Kept so callers still passing them don't fail; they have no effect and the run
      # shows a warning asking to remove them.
      has_composer:
        required: false
        type: boolean
        default: false
        description: "Deprecated, no effect: Composer is detected from composer.json."
      php_version:
        required: false
        type: string
        default: "8.4"
        description: "PHP version to use for composer"
      has_package_json:
        required: false
        type: boolean
        default: false
        description: "Deprecated, no effect: npm is detected from package.json."
      node_version:
        required: false
        type: string
        default: "22"
        description: "Node.js version to use for npm"
      exclude:
        required: false
        type: string
        default: ""
        description: "Extra rsync exclude patterns, one per line or comma-separated. Added to the default list."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::This workflow only publishes a release from a tag (refs/tags/*)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Composer and npm
        id: detect
        run: |
          composer=false; npm=false
          [ -f composer.json ] && composer=true
          [ -f package.json ] && npm=true
          echo "composer=$composer" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          echo "Composer: $composer, npm: $npm"
          if [ "${{ inputs.has_composer }}" = "true" ] || [ "${{ inputs.has_package_json }}" = "true" ]; then
            echo "::warning::has_composer and has_package_json have no effect since v2 (detected from composer.json and package.json). Remove them from the caller workflow."
          fi

      - name: Setup PHP
        if: steps.detect.outputs.composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer
          coverage: none

      - name: Setup Node.js
        if: steps.detect.outputs.npm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Configure Composer auth for private repos
        if: steps.detect.outputs.composer == 'true'
        env:
          COMPOSER_TOKEN: ${{ secrets.LCF_COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -n "$COMPOSER_TOKEN" ]; then
            composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
          fi

      - name: Install PHP dependencies
        if: steps.detect.outputs.composer == 'true'
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is required for a reproducible release."
            exit 1
          fi
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Install npm dependencies
        if: steps.detect.outputs.npm == 'true'
        run: npm ci

      - name: Build assets
        if: steps.detect.outputs.npm == 'true'
        run: npm run build --if-present

      - name: Prepare zip
        env:
          PACKAGE_SLUG: ${{ github.event.repository.name }}
          EXTRA_EXCLUDES: ${{ inputs.exclude }}
        run: |
          # The zip file is package-slug-1.2.0.zip. A leading "v" on the tag is dropped.
          # The directory inside stays package-slug/, without the version, so WordPress
          # installs and updates plugins and themes in the same folder.
          # tools/ and vendor/composer/autoload_aliases.php are Strauss build artifacts
          # (the pinned strauss.phar and the dev-only class-alias shim). Neither belongs in
          # a release; the exclusions are no-ops for packages that don't use Strauss.
          # Do not exclude src/ by default: many plugins ship PHP under src/ (PSR-4).
          # Callers that use src/ only for front-end source should pass exclude: src/.
          extra_excludes=()
          while IFS= read -r pattern; do
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            pattern="${pattern%,}"
            [ -z "$pattern" ] && continue
            extra_excludes+=(--exclude "$pattern")
          done <<< "${EXTRA_EXCLUDES//,/$'\n'}"

          stage="/tmp/wp-package-stage/${PACKAGE_SLUG}"
          mkdir -p "$stage"
          rsync -a \
            --exclude '.git/' \
            --exclude '.gitignore' \
            --exclude '.github/' \
            --exclude '.vscode/' \
            --exclude '.DS_Store' \
            --exclude 'tests/' \
            --exclude 'screenshots/' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'bin/' \
            --exclude 'tools/' \
            --exclude 'vendor/bin/' \
            --exclude 'vendor/composer/autoload_aliases.php' \
            --exclude 'package-lock.json' \
            --exclude 'package.json' \
            --exclude 'vite.config.mjs' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpstan.neon' \
            --exclude 'phpunit.xml' \
            --exclude '.php-cs-fixer.php' \
            --exclude '.php-cs-fixer.cache' \
            "${extra_excludes[@]}" \
            ./ "$stage/"
          version="${GITHUB_REF_NAME#v}"
          zip_path="/tmp/${PACKAGE_SLUG}-${version}.zip"
          (
            cd /tmp/wp-package-stage
            zip -r "$zip_path" "$PACKAGE_SLUG"
          )
          echo "ZIP_PATH=${zip_path}" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
